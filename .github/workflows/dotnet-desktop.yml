name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build COM3D2 (Unity 5.6.4, net35)
        run: dotnet build COM3D2.PropMyItem.Plugin.sln -c COM3D2-Release

      - name: Build COM3D2.5 (Unity 2022.3, net48)
        run: dotnet build COM3D2.PropMyItem.Plugin.sln -c COM3D25_UNITY_2022-Release

      - name: Publish Artifact (COM3D2)
        uses: actions/upload-artifact@v7
        with:
          name: COM3D2.PropMyItem.Plugin-COM3D2
          path: COM3D2.PropMyItem.Plugin/bin/Release/COM3D2/net35/COM3D2.PropMyItem.Plugin.dll

      - name: Publish Artifact (COM3D2.5)
        uses: actions/upload-artifact@v7
        with:
          name: COM3D2.PropMyItem.Plugin-COM3D25
          path: COM3D2.PropMyItem.Plugin/bin/Release/COM3D25/net48/COM3D2.PropMyItem.Plugin.dll
